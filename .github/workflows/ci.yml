name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the production runtime (Dockerfile `node:22`) so the npm 10 lockfile
          # validates identically in CI and in the deployed image.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # All gates pass with no DB or external keys (mock fallback / USE_DB unset).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs the same unit suite as `npm run test`, plus the coverage ratchet on the pure lib/ layer
      # (thresholds in vitest.config.ts) so pure-layer coverage can't silently regress.
      - name: Test + coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  # DB-mode integration: spins up a real Postgres, applies migrations + seed, then runs the
  # USE_DB=true repository suite. Isolated from `verify` so the fast gate stays infra-free.
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentsverse
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agentsverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentsverse -d agentsverse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentsverse:testpassword@localhost:5432/agentsverse_test
      USE_DB: 'true'
      # The DB integration suite needs deterministic fixtures, so it opts into the mock business
      # data (the app itself defaults to config-only — no mock leads/demos/deals at runtime).
      SEED_DEMO_DATA: 'true'
      # Throwaway secret: db:seed creates a founder via Better Auth password hashing.
      # Not a real credential and never used at runtime.
      BETTER_AUTH_SECRET: ci-throwaway-secret-for-seed-only-00000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: DB integration tests
        run: npm run test:db
