name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the production runtime (Dockerfile `node:22`) so the npm 10 lockfile
          # validates identically in CI and in the deployed image.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # All gates pass with no DB or external keys (mock fallback / USE_DB unset).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
