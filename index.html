<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents Verse — Autonomous demo-first web agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <style>
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 999; transition: opacity .4s ease; }
    #boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot"><div style="opacity:.4"></div></div>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared React hooks as globals (each babel script is its own scope) -->
  <script>
    window.useState = React.useState; window.useEffect = React.useEffect;
    window.useRef = React.useRef; window.useCallback = React.useCallback;
    window.useMemo = React.useMemo; window.useLayoutEffect = React.useLayoutEffect;
  </script>

  <!-- Data (plain JS) -->
  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="data4.js"></script>

  <!-- Primitives -->
  <script type="text/babel" src="brand.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="site-mock.jsx"></script>
  <script type="text/babel" src="floor-map.jsx"></script>

  <!-- Landing -->
  <script type="text/babel" src="landing-sections.jsx"></script>
  <script type="text/babel" src="landing-sections2.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>

  <!-- App screens -->
  <script type="text/babel" src="app-shell.jsx"></script>
  <script type="text/babel" src="floor-overview.jsx"></script>
  <script type="text/babel" src="command.jsx"></script>
  <script type="text/babel" src="rooms.jsx"></script>
  <script type="text/babel" src="agents.jsx"></script>
  <script type="text/babel" src="pipeline.jsx"></script>
  <script type="text/babel" src="audit.jsx"></script>
  <script type="text/babel" src="demos.jsx"></script>
  <script type="text/babel" src="deals.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>
  <script type="text/babel" src="activity.jsx"></script>
  <script type="text/babel" src="requests.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>
  <script type="text/babel" src="auth.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>

  <!-- Root -->
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // hide boot splash once React paints
    const obs = new MutationObserver(() => {
      if (document.getElementById('root').children.length) {
        document.getElementById('boot').classList.add('hide');
        obs.disconnect();
        setTimeout(() => { const b=document.getElementById('boot'); if(b) b.remove(); }, 500);
      }
    });
    obs.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>
