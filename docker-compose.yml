# Agents Verse — single-VPS compose: Next app ('web') + self-hosted Postgres ('db').
# Both run on the default internal compose network. Postgres is NOT published to the host
# (no `ports:` on db) — only `web` reaches it via the service DNS name `db:5432`.
#
# Secrets live in .env.local (git-ignored, chmod 600 on the VPS), loaded via env_file:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   DATABASE_URL=postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>
#   BETTER_AUTH_SECRET, BETTER_AUTH_URL, FOUNDER_EMAIL, FOUNDER_PASSWORD, GOOGLE_MAPS_API_KEY, ...
# Put a reverse proxy (Caddy/Nginx) in front of `web` to terminate TLS (omitted — use your edge).
services:
  db:
    image: postgres:17-alpine
    # No `ports:` — Postgres stays on the internal network only (not reachable from host/Internet).
    env_file:
      - .env.local            # provides POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # pg_isready ships in the image; gate `web` start on the cluster accepting connections.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s        # covers first-boot initdb before marking unhealthy

  web:
    build:
      context: .
    env_file:
      - .env.local             # DATABASE_URL now points at db:5432; INNGEST_* for sending events
    environment:
      USE_DB: "true"
      INNGEST_BASE_URL: http://inngest:8288   # web only sends events to the Inngest server
    depends_on:
      db:
        condition: service_healthy   # don't start web until Postgres healthcheck passes
      inngest:
        condition: service_started
    ports:
      - "3000:3000"            # behind your reverse proxy; bind "127.0.0.1:3000:3000" if proxy is on-host
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s       # entrypoint runs wait-for-db -> migrate -> seed (scrypt) before listening

  # --- Audit subsystem (Subsystem 2): queue + durable worker ----------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist the queue across restarts
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Self-hosted Inngest server (durable execution gateway). Internal-only; expose 8288 to
  # localhost only if you want the dev dashboard. The image has no ENTRYPOINT and its default
  # CMD is the bare `inngest` binary, so the subcommand MUST include it: `["inngest", "start"]`
  # (a bare `["start"]` makes Docker exec a non-existent `start` binary). `start` is the
  # production self-host mode and needs INNGEST_EVENT_KEY + INNGEST_SIGNING_KEY (set in .env.local);
  # for a keyless local run use `["inngest", "dev"]` instead.
  inngest:
    image: inngest/inngest:v1.27.0
    command: ["inngest", "start"]
    env_file:
      - .env.local
    environment:
      INNGEST_POSTGRES_URI: ${INNGEST_DATABASE_URL:-}   # Inngest server state (may reuse the app db)
      INNGEST_REDIS_URI: redis://redis:6379
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # ports: ["127.0.0.1:8288:8288"]   # uncomment for the local Inngest dashboard

  # LLM gateway (9router): the demo-gen worker shells `claude` pointed at this service instead of
  # talking to Anthropic directly, so the Claude subscription (or a free Claude provider) is connected
  # ONCE in the dashboard and persisted + auto-refreshed in the data volume — the worker never holds a
  # raw OAuth token that a rebuild would drop. One-time setup: open http://localhost:20128, log in with
  # INITIAL_PASSWORD, connect a provider (Claude Code OAuth + Kiro free as a fallback combo), create an
  # API key, then put it in .env.local as ANTHROPIC_AUTH_TOKEN and the combo name in AGENT_MODEL_OPUS.
  "9router":
    image: decolua/9router:latest
    env_file:
      - .env.local             # JWT_SECRET, INITIAL_PASSWORD (9router admin login)
    environment:
      DATA_DIR: /app/data      # persisted provider auth + config live here (the named volume below)
      PORT: "20128"
      # Demo-gen produces large single-shot HTML (~6+ min of streaming, a big reference-anchored prompt
      # with opus extended thinking). 9router's defaults (first-chunk 200s, stall 360s, connect 60s) can
      # abort a HEALTHY long run before it finishes — raise them so only a genuine hang trips. These are
      # read by open-sse/config/runtimeConfig.js via its envMs() helper.
      STREAM_FIRST_CHUNK_TIMEOUT_MS: "600000"   # 10 min time-to-first-token (long prefill/thinking)
      STREAM_STALL_TIMEOUT_MS: "900000"         # 15 min inter-chunk stall ceiling
      FETCH_CONNECT_TIMEOUT_MS: "180000"        # 3 min for upstream response headers
    volumes:
      - ninerouter_data:/app/data
    ports:
      - "127.0.0.1:20128:20128"   # dashboard, localhost-only; the worker reaches it via service DNS
    restart: unless-stopped
    stop_grace_period: 15s

  # Audit + demo-gen worker: Playwright + Gemini + the `claude` CLI run here (keeps `web` slim).
  # Registers functions via outbound connect() — no inbound port. mem_limit guards the VPS from OOM.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.local             # DATABASE_URL, GEMINI_API_KEY, GOOGLE_PAGESPEED_API_KEY, INNGEST_*, AUDIT_CONCURRENCY, ANTHROPIC_AUTH_TOKEN, AGENT_MODEL_*
    environment:
      USE_DB: "true"
      INNGEST_BASE_URL: http://inngest:8288
      # Point the `claude` CLI at the 9router gateway. ANTHROPIC_AUTH_TOKEN (the 9router API key) and
      # AGENT_MODEL_OPUS (the combo id) come from .env.local; clear ANTHROPIC_BASE_URL there to fall
      # back to a direct subscription via CLAUDE_CODE_OAUTH_TOKEN instead.
      ANTHROPIC_BASE_URL: http://9router:20128
    depends_on:
      db:
        condition: service_healthy
      inngest:
        condition: service_started
      "9router":
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s     # let SIGTERM close the browser + drain the pool
    mem_limit: 2g

volumes:
  pgdata:
  redisdata:
  ninerouter_data:
